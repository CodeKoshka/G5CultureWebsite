<!DOCTYPE hmtl>
<html lang= "en" data-theme= "light">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Quiz Start</title>
        <link rel="icon" type="image/png" href="CelliniaTexasWaifuReadmeType.png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/styleQuizStart.css">
</head>

<body>
    <div class="start-screen">
        <button id="start-button">Start</button>
    </div>
    <div id="display-container">
        <div class="header">
            <div class="number-of-count">
                <span id="number-of-question">1 of 10 Questions</span>
            </div>
            <div class="timer-div">
                <img src="CelliniaTexasWaifuReadmeType.png" alt="" width="20">
                <span id="time-left"></span>
            </div>
        </div>
        <div id="container"></div>
        <button id="next-button">Next</button>
    </div>
    <div class="score-container hide">
        <div id="user-score">Score</div>
        <button id="restart">Restart</button>
    </div>
    <script src="Js/QuizTest.js" type="text/javascript"></script>
    </body>
</html>
